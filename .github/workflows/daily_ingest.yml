name: Automated Daily Weather Ingestion & ML Inference

on:
  schedule:
    # 06:00 AM IST corresponds to 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Date (YYYY-MM-DD) to backfill or ingest (leave empty for yesterday)'
        required: false
        default: ''
      force:
        description: 'Force overwrite existing database records'
        required: false
        type: boolean
        default: false

jobs:
  daily-ingest:
    name: Ingest Open-Meteo & Refresh Risk Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Ingestion Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install -r MahaRainRisk/requirements.txt
          fi

      - name: Verify Database Credentials
        run: |
          if [ -z "${{ secrets.DATABASE_URL }}" ] && [ -z "${{ secrets.PGPASSWORD }}" ]; then
            echo "::warning::Neither DATABASE_URL nor PGPASSWORD secret is set in GitHub Repository Secrets."
            echo "::notice::Add DATABASE_URL under GitHub Repo Settings -> Secrets and variables -> Actions to allow live PostgreSQL ingestion."
          fi

      - name: Execute Daily Ingestion Pipeline
        env:
          PYTHONPATH: .
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT || 5432 }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -f "etl/daily_cron_ingestion.py" ]; then
            python etl/daily_cron_ingestion.py $ARGS
          else
            python MahaRainRisk/etl/daily_cron_ingestion.py $ARGS
          fi

      - name: Telemetry & Failure Alert
        if: failure()
        run: |
          echo "::error::MahaRainRisk Daily Ingestion Pipeline encountered an error! Check logs."

